<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectando ao Meu Cuidado</title>
    <style>
        body {
            background-color: #F7F9FC;
            color: #1A1A2E;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .loader {
            animation: spin 1s linear infinite;
            border: 4px solid #F3F3F3;
            border-radius: 50%;
            border-top: 4px solid #007AFF;
            height: 45px;
            margin: 30px auto;
            width: 45px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn {
            background-color: #007AFF;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 122, 255, 0.15);
            color: #FFFFFF;
            display: inline-block;
            font-weight: bold;
            margin-top: 20px;
            padding: 14px 28px;
            text-decoration: none;
        }

        #fallback {
            display: none;
            margin-top: 30px;
            padding: 0 10px;
        }

        footer {
            margin-top: 48px;
        }

        .privacy-link {
            color: #3558A2;
        }
    </style>
</head>
<body>
    <main id="invite-content">
        <h2>Abrindo o convite no aplicativo Meu Cuidado...</h2>
        <div class="loader"></div>

        <div id="fallback">
            <p>Se o seu aplicativo nao abrir automaticamente, clique no botao abaixo:</p>
            <a id="app-link" class="btn" href="#">Abrir no Aplicativo</a>
        </div>
    </main>

    <footer>
        <a class="privacy-link" href="/politica-de-privacidade/">Politica de Privacidade</a>
    </footer>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (token) {
                const deepLinkUrl = "mylittle://invite/" + token;

                window.location.href = deepLinkUrl;

                setTimeout(function() {
                    document.getElementById('app-link').href = deepLinkUrl;
                    document.getElementById('fallback').style.display = 'block';
                }, 2500);
            } else {
                document.getElementById('invite-content').innerHTML =
                    "<h2>A URL do convite esta mal formatada ou falta o token.</h2>";
            }
        };
    </script>
</body>
</html>
