.wrap{--teal:#0F5C52;--deep:#0A3F38;--mint:#6FD6C0;--mintL:#C6E1D8;
  font-family:'Manrope',sans-serif;color:#fff;position:relative;overflow:hidden;border-radius:18px;
  background:radial-gradient(120% 90% at 85% 8%, #1a7d6b 0%, var(--teal) 40%, var(--deep) 100%);}
.wrap *{box-sizing:border-box;margin:0;}
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 40px;position:relative;z-index:3;}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.3px;}
.brand img{width:34px;height:34px;}
.navcta{font-weight:700;font-size:14px;padding:10px 18px;border:1px solid rgba(255,255,255,.25);border-radius:999px;color:#fff;background:rgba(255,255,255,.06);}
.hero{display:flex;align-items:center;gap:40px;padding:38px 40px 60px;position:relative;z-index:2;}
.left{flex:1;min-width:0;}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:var(--mint);
  border:1px solid rgba(111,214,192,.4);background:rgba(111,214,192,.08);padding:7px 14px;border-radius:999px;
  opacity:0;animation:up .7s .05s both;}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(111,214,192,.6);animation:pulse 2s infinite;}
h1{font-weight:800;font-size:47px;line-height:1.04;letter-spacing:-1.6px;margin:20px 0 0;max-width:560px;opacity:0;animation:up .7s .18s both;}
h1 .hl{color:var(--mint);}
.sub{font-weight:500;font-size:18px;line-height:1.5;color:var(--mintL);margin-top:20px;max-width:460px;opacity:0;animation:up .7s .30s both;}
.cta{display:flex;gap:14px;margin-top:32px;opacity:0;animation:up .7s .42s both;}
.btn1{font-weight:800;font-size:15.5px;color:#06231F;background:var(--mint);padding:15px 26px;border-radius:14px;box-shadow:0 10px 30px rgba(111,214,192,.28);}
.btn2{font-weight:700;font-size:15.5px;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.28);padding:15px 24px;border-radius:14px;}
.stat{display:flex;gap:28px;margin-top:34px;opacity:0;animation:up .7s .54s both;}
.stat b{display:block;font-weight:800;font-size:22px;}
.stat span{font-weight:500;font-size:12.5px;color:var(--mintL);}
.right{flex:0 0 300px;display:flex;justify-content:center;position:relative;}
.phone{width:290px;border-radius:38px;padding:9px;background:linear-gradient(160deg,#0c2f2a,#08221e);
  box-shadow:0 40px 90px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);transform:rotate(3deg);
  animation:floaty 6s ease-in-out infinite;opacity:0;animation:up .8s .5s both, floaty 6s ease-in-out 1.3s infinite;}
.phone img{width:100%;display:block;border-radius:30px;}
.glow{position:absolute;width:520px;height:520px;right:-120px;top:-160px;z-index:1;
  background:radial-gradient(circle,rgba(111,214,192,.22),transparent 62%);filter:blur(10px);animation:breathe 7s ease-in-out infinite;}
@keyframes up{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
@keyframes floaty{0%,100%{transform:rotate(3deg) translateY(0);}50%{transform:rotate(3deg) translateY(-16px);}}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,214,192,.6);}70%{box-shadow:0 0 0 9px rgba(111,214,192,0);}100%{box-shadow:0 0 0 0 rgba(111,214,192,0);}}
@media(max-width:720px){.hero{flex-direction:column;text-align:center;}h1{font-size:34px;}.right{flex:none;}.cta,.stat,.badge{justify-content:center;}.sub,h1{margin-left:auto;margin-right:auto;}}
</style>
